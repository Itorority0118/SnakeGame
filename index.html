<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>SNAKE GAME</h1>
    <div class="game-container">
        <canvas id="game" width="500" height="500"></canvas>
        <div id="main-menu" class="menu-overlay">
            <div id="menu-screen" class="empty-screen">

            </div>
            <div class="button-group">
                <button id="level-btn" onclick="pickLevel()">LEVEL 1</button>
                <button id="start-btn" onclick="startGame()">START</button>
                <button id="settings-btn" onclick="openSettings()">SETTINGS</button>
            </div>
            <div id="settings-modal" class="settings-box hidden">
                <h3>SETTINGS</h3>
                <label>
                    <input type="checkbox" id="sound-toggle" checked>Enable Sound
                </label>
                <br><br>
                <button onclick="closeSettings()">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
